<!doctype html>
<html lang="en" class="th-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Leaderdle: guess the world leader</title>
    <meta name="description" content="A daily guessing game about world leaders since 1900. Four short puzzles a day, the same for everyone. No account needed." />
    <meta name="theme-color" content="#F3EEE3" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://leaderdle.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leaderdle" />
    <meta property="og:title" content="Leaderdle: guess the world leader" />
    <meta property="og:description" content="Four short daily puzzles about world leaders. The same for everyone, new ones at midnight." />
    <meta property="og:url" content="https://leaderdle.com/" />
    <meta property="og:image" content="https://leaderdle.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Leaderdle logo with a row of answer tiles" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('leaderdle') || '{}').settings || {};
        var c = document.documentElement.classList;
        if (s.dark) { c.remove('th-light'); c.add('th-dark'); }
        if (s.cb) c.add('cb');
        if (s.reduce) c.add('reduce');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Leaderdle needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
