<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic, game in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#1B2A28}a:hover{color:#1B2A28}
button:active{transform:translate(0,3px)}
input::placeholder{color:#4A5A56;opacity:1}
</style>
</helmet>
<div style="width: 360px; min-height: 780px; box-sizing: border-box; background: #F1F4E8; color: #1B2A28; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px 0 16px; box-sizing: border-box">
<a href="B-Home.dc.html" aria-label="Leaderdle home" style="display: flex; align-items: center; gap: 3px; height: 44px; text-decoration: none; color: #1B2A28; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 22px">Leader<span style="display: inline-flex; gap: 2px; margin-left: 2px"><span style="display: inline-block; width: 17px; text-align: center; background: #C92C76; color: #FFFFFF; border-radius: 6px; box-shadow: 0 2px 0 rgba(27,42,40,0.3)">d</span><span style="display: inline-block; width: 17px; text-align: center; background: #4CC3F0; color: #1B2A28; border-radius: 6px; box-shadow: 0 2px 0 rgba(27,42,40,0.3)">l</span><span style="display: inline-block; width: 17px; text-align: center; background: #FF8A3D; color: #1B2A28; border-radius: 6px; box-shadow: 0 2px 0 rgba(27,42,40,0.3)">e</span></span></a>
<div style="flex-grow: 1"></div>
<div role="img" aria-label="Streak: 12 days" style="display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 7px; background: #FBFCF5; border: solid 2px #1B2A28; border-radius: 999px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#FFD23F" stroke="#1B2A28" stroke-width="2.5" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-6 1-9z"/></svg>12</div>
<button aria-label="How to play" style="width: 44px; height: 44px; padding: 0; background: transparent; border: 0; color: #1B2A28; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"/><path d="M12 17h.01"/></svg></button>
<button aria-label="Statistics" style="width: 44px; height: 44px; padding: 0; background: transparent; border: 0; color: #1B2A28; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
<button aria-label="Settings" style="width: 44px; height: 44px; padding: 0; background: transparent; border: 0; color: #1B2A28; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>
<main style="display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 24px">
<nav aria-label="Game modes" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="B-Classic.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 44px; background: #C92C76; color: #FFFFFF; border: 2px solid transparent; border-radius: 999px; box-shadow: 0 3px 0 rgba(27,42,40,0.3); text-decoration: none; font-weight: 700; font-size: 14px">Classic</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; background: #FBFCF5; color: #1B2A28; border: 2px solid transparent; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #4CC3F0"></span>Succession</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; background: #FBFCF5; color: #1B2A28; border: 2px solid transparent; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #FF8A3D"></span>Timeline</a>
</nav>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15">Classic <span style="font-size: 16px; font-weight: 600; color: #4A5A56; font-variant-numeric: tabular-nums">#128</span></h1>
<span style="font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums">5 guesses left</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="guess" style="font-weight: 700; font-size: 13px">Who is today's leader?</label>
<div style="display: flex; gap: 8px">
<input id="guess" type="text" autocomplete="off" placeholder="Type a name" style="flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; background: #FBFCF5; color: #1B2A28; border: solid 2px #1B2A28; border-radius: 16px; font-family: inherit; font-size: 16px">
<button style="height: 48px; padding: 0 18px; background: #C92C76; color: #FFFFFF; border: 2px solid transparent; border-radius: 16px; box-shadow: 0 4px 0 rgba(27,42,40,0.3); font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 17px; cursor: pointer">Guess</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-items: end; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.15; color: #4A5A56">
<span>Country</span>
<span>Role</span>
<span>Took office</span>
<span>Years in office</span>
<span>Age at start</span>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 6px"><strong style="font-size: 15px">{{row.name}}</strong><span style="font-size: 13px; color: #4A5A56">{{row.country}}</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{row.tiles}}" as="t" hint-placeholder-count="5">
<div role="img" aria-label="{{t.aria}}" style="position: relative; height: 60px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{t.bg}}; border: 2px solid transparent; border-radius: 16px; box-shadow: 0 3px 0 rgba(27,42,40,0.3); font-weight: 700; font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums">
<span>{{t.val}}</span>
<sc-if value="{{t.up}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B2A28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></sc-if>
<sc-if value="{{t.down}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B2A28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></sc-if>
<sc-if value="{{t.ok}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -7px; right: -6px; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; box-sizing: border-box; background: #FBFCF5; border: solid 2px #1B2A28; border-radius: 50%"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1B2A28" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
<sc-if value="{{t.near}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -7px; right: -6px; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; box-sizing: border-box; background: #FBFCF5; border: solid 2px #1B2A28; border-radius: 50%"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1B2A28" stroke-width="4" stroke-linecap="round"><path d="M5 9c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0M5 15c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0"/></svg></span></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
<aside aria-label="Advertisement" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #4A5A56">Advertisement</span>
<div style="display: flex; align-items: center; justify-content: center; width: 320px; height: 100px; box-sizing: border-box; border: dashed 2px #4A5A56; border-radius: 8px; color: #4A5A56; font-size: 13px">Ad space · 320 × 100</div>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const bg = { g: '#23B573', y: '#FFD23F', x: '#D5D8CB' };
const word = { g: 'correct', y: 'close', x: 'no match' };
const t = (label, val, s, dir, hint) => ({
val: val, bg: bg[s], ok: s === 'g', near: s === 'y', up: dir === 'u', down: dir === 'd',
aria: label + ': ' + val + ', ' + (hint ? (s === 'y' ? 'close, ' : '') + 'target is ' + hint : word[s])
});
const rows = [
{ name: 'Nelson Mandela', country: 'South Africa', tiles: [
t('Country', 'ZAF', 'x'), t('Role', 'Both', 'y'), t('Took office', '1994', 'x', 'u', 'later'),
t('Years in office', '5', 'x', 'u', 'more'), t('Age at start', '75', 'x', 'd', 'younger')] },
{ name: 'Margaret Thatcher', country: 'United Kingdom', tiles: [
t('Country', 'GBR', 'y'), t('Role', 'Gov', 'g'), t('Took office', '1979', 'x', 'u', 'later'),
t('Years in office', '11', 'x', 'u', 'more'), t('Age at start', '53', 'y', 'd', 'younger')] },
{ name: 'Lee Kuan Yew', country: 'Singapore', tiles: [
t('Country', 'SGP', 'x'), t('Role', 'Gov', 'g'), t('Took office', '1959', 'x', 'u', 'later'),
t('Years in office', '31', 'x', 'd', 'fewer'), t('Age at start', '35', 'x', 'u', 'older')] }
];
return { rows: rows };
}
}
</script>
</body>
</html>
